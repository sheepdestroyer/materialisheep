name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
      - name: Setup Release Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p "${{ runner.temp }}/keystore"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/keystore/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=${{ runner.temp }}/keystore/release.keystore" >> $GITHUB_ENV
      - name: Build release APK
        run: ./gradlew assembleRelease
      - name: Prepare and verify release APK
        run: |
          APK_NAME="materialisheep-${{ github.ref_name }}.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            SRC_APK="app/build/outputs/apk/release/app-release.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            SRC_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          else
            SRC_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          cp "$SRC_APK" "${APK_NAME}"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          if [ -n "$RELEASE_KEYSTORE_PATH" ] && [ -f "$RELEASE_KEYSTORE_PATH" ]; then
            echo "Persistent release keystore configured."
            CERTS=$("$BUILD_TOOLS_DIR/apksigner" verify --print-certs "${APK_NAME}" 2>&1 || true)
            if echo "$CERTS" | grep -q "CN=MaterialiSheep"; then
              echo "APK is already signed with persistent release key."
            else
              echo "Signing APK with persistent release key via apksigner..."
              "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "${APK_NAME}" "${APK_NAME}.aligned" || cp "${APK_NAME}" "${APK_NAME}.aligned"
              "$BUILD_TOOLS_DIR/apksigner" sign \
                --ks "$RELEASE_KEYSTORE_PATH" \
                --ks-pass "pass:$RELEASE_KEYSTORE_PASSWORD" \
                --key-pass "pass:$RELEASE_KEY_PASSWORD" \
                --ks-key-alias "$RELEASE_KEY_ALIAS" \
                --out "${APK_NAME}" "${APK_NAME}.aligned"
              rm -f "${APK_NAME}.aligned"
            fi
          else
            echo "No persistent release keystore found. Falling back to debug keystore..."
            if ! "$BUILD_TOOLS_DIR/apksigner" verify "${APK_NAME}" >/dev/null 2>&1; then
              DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
              if [ ! -f "$DEBUG_KEYSTORE" ]; then
                mkdir -p "$HOME/.android"
                keytool -genkey -v -keystore "$DEBUG_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              fi
              "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "${APK_NAME}" "${APK_NAME}.aligned" || cp "${APK_NAME}" "${APK_NAME}.aligned"
              "$BUILD_TOOLS_DIR/apksigner" sign --ks "$DEBUG_KEYSTORE" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out "${APK_NAME}" "${APK_NAME}.aligned"
              rm -f "${APK_NAME}.aligned"
            fi
          fi

          echo "Verifying APK signature:"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
      - name: Clean up Release Keystore
        if: always()
        run: |
          rm -rf "${{ runner.temp }}/keystore"
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
      - name: Publish GitHub Release with APK Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists. Attempting to upload asset..."
            gh release upload "${{ github.ref_name }}" "${{ env.APK_NAME }}" --clobber || true
          else
            gh release create "${{ github.ref_name }}" "${{ env.APK_NAME }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
