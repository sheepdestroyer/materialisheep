name: Backup Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Keystore Backup
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          mkdir -p keystore-export
          echo "$KEYSTORE_BASE64" | base64 -d > keystore-export/materialisheep.keystore
          cat <<EOF > keystore-export/keystore-info.txt
          RELEASE_KEY_ALIAS=$KEY_ALIAS
          RELEASE_KEY_PASSWORD=$KEYSTORE_PASS
          RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASS
          EOF
      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v6
        with:
          name: materialisheep-keystore
          path: keystore-export/
          retention-days: 1
